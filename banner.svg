<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="55%" stop-color="#1F3A68"/>
      <stop offset="100%" stop-color="#2F5C9E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FB3F5"/>
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2B84B"/>
      <stop offset="100%" stop-color="#E0A030" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <circle cx="1080" cy="-40" r="220" fill="#FFFFFF" fill-opacity="0.04"/>
  <circle cx="1150" cy="330" r="160" fill="#FFFFFF" fill-opacity="0.03"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="120" fill="#FFFFFF" font-size="58" font-weight="700">Ramya Rajendra</text>
    <text x="72" y="162" fill="#F2B84B" font-size="24" font-weight="600">Business &amp; Process Analyst</text>
    <text x="72" y="196" fill="#DCE3F0" font-size="18">Finding where processes lose time and money, and which fix pays off first</text>

    <g font-size="15" fill="#FFFFFF">
      <rect x="72" y="230" width="156" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="150" y="252" text-anchor="middle">Process analysis</text>
      <rect x="240" y="230" width="222" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="351" y="252" text-anchor="middle">Finance &amp; group reporting</text>
      <rect x="474" y="230" width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <text x="559" y="252" text-anchor="middle">Product analytics</text>
    </g>
  </g>

  <!-- chart: bars grow in, one highlighted -->
  <g transform="translate(830,260)">
    <line x1="-10" y1="0" x2="300" y2="0" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <rect x="0"   width="34" rx="4" fill="url(#bar)" y="-70"  height="70">
      <animate attributeName="height" from="0" to="70" dur="0.9s" begin="0.1s" fill="freeze"/>
      <animate attributeName="y" from="0" to="-70" dur="0.9s" begin="0.1s" fill="freeze"/>
    </rect>
    <rect x="50"  width="34" rx="4" fill="url(#bar)" y="-105" height="105">
      <animate attributeName="height" from="0" to="105" dur="0.9s" begin="0.2s" fill="freeze"/>
      <animate attributeName="y" from="0" to="-105" dur="0.9s" begin="0.2s" fill="freeze"/>
    </rect>
    <rect x="100" width="34" rx="4" fill="url(#bar)" y="-88"  height="88">
      <animate attributeName="height" from="0" to="88" dur="0.9s" begin="0.3s" fill="freeze"/>
      <animate attributeName="y" from="0" to="-88" dur="0.9s" begin="0.3s" fill="freeze"/>
    </rect>
    <rect x="150" width="34" rx="4" fill="url(#hot)" y="-175" height="175">
      <animate attributeName="height" from="0" to="175" dur="1.1s" begin="0.4s" fill="freeze"/>
      <animate attributeName="y" from="0" to="-175" dur="1.1s" begin="0.4s" fill="freeze"/>
    </rect>
    <rect x="200" width="34" rx="4" fill="url(#bar)" y="-120" height="120">
      <animate attributeName="height" from="0" to="120" dur="0.9s" begin="0.5s" fill="freeze"/>
      <animate attributeName="y" from="0" to="-120" dur="0.9s" begin="0.5s" fill="freeze"/>
    </rect>
    <rect x="250" width="34" rx="4" fill="url(#bar)" y="-95"  height="95">
      <animate attributeName="height" from="0" to="95" dur="0.9s" begin="0.6s" fill="freeze"/>
      <animate attributeName="y" from="0" to="-95" dur="0.9s" begin="0.6s" fill="freeze"/>
    </rect>
    <circle cx="167" cy="-192" r="6" fill="#F2B84B" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
      <animate attributeName="r" values="6;10;6" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
