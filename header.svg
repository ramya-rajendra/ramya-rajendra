<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Ramya Rajendra, business and process analyst. Purchase-to-pay flow with the payment block highlighted." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .name { font: 400 50px Georgia, 'Times New Roman', serif; fill: #EEF1F7; }
    .lead { font: 400 21px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #C9D2E3; }
    .meta { font: 400 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8693AD; }
    .step { font: 500 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #DCE2EE; }
    .note { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8693AD; }
    .warn { font: 600 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #F2A541; }
    .token { animation: travel 9s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes travel {
      0%   { transform: translateX(0); opacity: 0; }
      4%   { opacity: 1; }
      52%  { transform: translateX(752px); }
      72%  { transform: translateX(752px); }
      92%  { transform: translateX(940px); opacity: 1; }
      100% { transform: translateX(940px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .token { animation: none; opacity: 0; } }
  </style>

  <rect width="1200" height="380" rx="14" fill="#1C2740"/>

  <text x="80" y="92" class="name">Ramya Rajendra</text>
  <text x="80" y="132" class="lead">I find where business processes lose time, and show it with data.</text>
  <text x="80" y="162" class="meta">Business and process analyst in Würzburg, Germany. Computer Science, then an MBA at THWS.</text>

  <!-- process line -->
  <line x1="130" y1="280" x2="1070" y2="280" stroke="#3A4868" stroke-width="2"/>

  <!-- invoice to payment span -->
  <path d="M506 236 V226 H1070 V236" fill="none" stroke="#5B6A8A" stroke-width="1.2"/>
  <text x="788" y="216" text-anchor="middle" class="note">median 64 days from vendor invoice to payment</text>

  <!-- steps -->
  <g>
    <circle cx="130"  cy="280" r="9" fill="#1C2740" stroke="#8693AD" stroke-width="2"/>
    <circle cx="318"  cy="280" r="9" fill="#1C2740" stroke="#8693AD" stroke-width="2"/>
    <circle cx="506"  cy="280" r="9" fill="#1C2740" stroke="#8693AD" stroke-width="2"/>
    <circle cx="694"  cy="280" r="9" fill="#1C2740" stroke="#8693AD" stroke-width="2"/>
    <rect   x="868" y="266" width="28" height="28" rx="3" transform="rotate(45 882 280)" fill="#1C2740" stroke="#F2A541" stroke-width="2.4"/>
    <circle cx="1070" cy="280" r="9" fill="#8693AD"/>
  </g>

  <text x="130"  y="318" text-anchor="middle" class="step">Purchase order</text>
  <text x="318"  y="318" text-anchor="middle" class="step">Goods receipt</text>
  <text x="506"  y="318" text-anchor="middle" class="step">Vendor invoice</text>
  <text x="694"  y="318" text-anchor="middle" class="step">Invoice recorded</text>
  <text x="882"  y="318" text-anchor="middle" class="step">Payment block</text>
  <text x="1070" y="318" text-anchor="middle" class="step">Paid</text>

  <text x="600"  y="262" text-anchor="middle" class="note">10 days waiting</text>
  <text x="882"  y="340" text-anchor="middle" class="warn">27.6% of cases, +10 days</text>

  <circle class="token" cx="130" cy="280" r="5" fill="#EEF1F7"/>
</svg>
